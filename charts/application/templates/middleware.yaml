apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: middleware-chain
  namespace: {{ .Release.Namespace }}
spec:
  chain:
    middlewares:
      - name: redirect-slash
      - name: replace-path-regex
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-slash
  namespace: {{ .Release.Namespace }}
spec:
  redirectRegex:
    regex: (http[s]?://[^/]+)/({{ .Values.host.path }})$
    replacement: /index.html
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: replace-path-regex
  namespace: {{ .Release.Namespace }}
spec:
  replacePathRegex:
    regex: "^/{{ .Values.host.path }}/(.*)"
    replacement: "/${1}"
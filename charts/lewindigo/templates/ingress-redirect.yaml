apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lewindigo-redirect
  namespace: lewindigo
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: redirect-to-canonical@kubernetescrd
spec:
  ingressClassName: reverse-proxy
  rules:
  - host: le-windigo.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dummy
            port:
              number: 80
  - host: www.le-windigo.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dummy
            port:
              number: 80

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lewindigo-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-middleware@kubernetescrd
spec:
  ingressClassName: reverse-proxy
  rules:
    - http:
      {{- if .Values.host.name }}
      host: {{ .Values.host.name }}
      {{- end }}
        paths:
          - path: {{ .Values.host.path }}
            pathType: Prefix
            backend:
              service:
                name: lewindigo-service
                port:
                  name: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: lewindigo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-http   # <-- The Service will look for this label
  template:
    metadata:
      labels:
        app: web-http
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80 # <-- Your application port inside the pod
---
apiVersion: v1
kind: Service
metadata:
  name: my-http-service
  namespace: lewindigo
spec:
  selector:
    app: web-http     # <-- Connects to the Pods matching this label
  ports:
    - protocol: TCP
      port: 8080      # <-- The port the service listens on inside the cluster
      targetPort: 80  # <-- The port on the pod where traffic is sent
  type: ClusterIP     # <-- Default type (internal only)
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app-ingress
  namespace: lewindigo
  annotations:
    # Routes this traffic through the HTTP entrypoint
    traefik.ingress.kubernetes.io/router.entryPoints: web
spec:
  ingressClassName: reverse-proxy
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-http-service
                port:
                  number: 8080

# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # Fetches all history so tags can be resolved
          fetch-tags: true  # Explicitly ensures tags are pulled down
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build packages
        run: |
          mkdir -p build
          cd build
          git tag
          TAGS=$(git tag | grep -E -e "-[0-9]+\.[0-9]+\.[0-9]+")
          echo "4"
          for TAG in ${TAGS}; do
            echo "5"
            APP=$(echo ${TAG} | sed "s/\(.*\)-[0-9]+\.[0-9]+\.[0-9]+/\1/")
            git switch -q --detach ${TAG}
            helm dependency update ../charts/${APP}
            helm package ../charts/${APP}
          done
          echo "6"

          git switch -q main
          echo "7"
          APPS=$(find ../charts/* -type d -maxdepth 0)
          echo "8"
          for APP in ${APPS}; do
          echo "9"
            helm dependency update ../charts/${APP}
            helm package ../charts/${APP}
          done
          
          helm repo index .
          cd ..

          mkdir -p packages
          mv build packages/helm-charts
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload builded files
          path: 'packages'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

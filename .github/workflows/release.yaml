name: Release Charts

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      - name: Detect changed charts
        id: list-changed
        run: |
          echo "changed=$(ct list-changed --config ct.yaml | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Package and push changed charts
        if: steps.list-changed.outputs.changed != ''
        run: |
          for chart in ${{ steps.list-changed.outputs.changed }}; do
            chart_name=$(basename "$chart")
            echo "📦 Packaging $chart_name"
            helm dependency update "$chart"
            helm package "$chart" --destination .packaged/

            version=$(helm show chart "$chart" | grep '^version:' | awk '{print $2}')
            echo "🚀 Pushing $chart_name version $version"
            helm push ".packaged/${chart_name}-${version}.tgz" oci://ghcr.io/tonorg/charts
          done